# Configuração do Netlify — usada tanto no deploy pela CLI quanto no deploy
# automático a partir do GitHub.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Arquivos gerados pelo Vite têm hash no nome: podem ficar em cache "para sempre".
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
